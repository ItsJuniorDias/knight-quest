<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Knight Quest — A Magic World Adventure</title>
<style>
:root {
  --bg: #0f0a1e;
  --panel: rgba(18, 12, 32, 0.86);
  --panel-border: rgba(255, 255, 255, 0.12);
  --gold: #ffd166;
  --heart: #ff3b5c;
  --text: #eae0c9;
  --text-dim: #b7a8c8;
  --accent: #7de3ff;
  --danger: #dd4422;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-user-select: none; user-select: none; }
#canvas { position: fixed; inset: 0; }
#canvas canvas { display: block; width: 100%; height: 100%; }

/* ---------------- HUD ---------------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud-top { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; }
#hud-hearts { display: flex; gap: 3px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; }
.heart svg { display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }
#hud-right { display: flex; gap: 10px; align-items: center; }
#hud-key { padding: 8px 12px; background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; font-size: 20px; box-shadow: 0 0 12px rgba(255,209,102,0.4); }
#hud-coins { padding: 8px 12px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; font-size: 16px; font-weight: 700; }
#hud-coins span { color: var(--gold); margin-left: 4px; }

#hud-room-label { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); padding: 6px 18px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0; transition: opacity 0.4s; }
#hud-room-label.fade { animation: labelFade 3s ease-out; }
@keyframes labelFade { 0% { opacity: 0; transform: translate(-50%, -6px);} 15% { opacity: 1; transform: translateX(-50%);} 80% { opacity: 1; } 100% { opacity: 0; } }

#hud-boss-bar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: min(500px, 80vw); padding: 6px; background: var(--panel); border: 1px solid var(--danger); border-radius: 8px; }
#hud-boss-fill { height: 12px; width: 100%; background: linear-gradient(90deg, #dd4422, #ff8844); border-radius: 4px; transition: width 0.2s; }
#hud-boss-label { text-align: center; font-size: 11px; letter-spacing: 3px; margin-top: 3px; color: var(--danger); }

#hud-toast { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); padding: 10px 20px; background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; font-size: 15px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); animation: toastIn 0.25s; }

#minimap { position: absolute; bottom: 20px; right: 20px; border-radius: 6px; opacity: 0.9; }

/* ---------------- Combo counter ---------------- */
#hud-combo { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); padding: 8px 18px; background: rgba(20, 12, 30, 0.75); border: 2px solid var(--combo-color, var(--gold)); border-radius: 999px; display: flex; align-items: center; gap: 8px; box-shadow: 0 0 20px var(--combo-color, rgba(255,209,102,0.5)); }
#hud-combo .cx { font-size: 26px; font-weight: 800; color: var(--combo-color, var(--gold)); text-shadow: 0 0 10px currentColor; }
#hud-combo .clabel { font-size: 11px; letter-spacing: 3px; color: var(--text-dim); }
#hud-combo.bump { animation: comboBump 0.32s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes comboBump { 0% { transform: translateX(-50%) scale(0.7); } 60% { transform: translateX(-50%) scale(1.22); } 100% { transform: translateX(-50%) scale(1); } }

/* ---------------- Interact prompt ---------------- */
#hud-interact { position: absolute; bottom: 190px; left: 50%; transform: translateX(-50%); padding: 8px 16px; background: var(--panel); border: 1px solid var(--gold); border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); animation: promptBob 1.4s ease-in-out infinite; }
#hud-interact .key { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 6px; background: var(--gold); color: var(--bg); font-weight: 800; font-size: 15px; }
#hud-interact .lbl { color: var(--text); letter-spacing: 1px; }
@keyframes promptBob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -4px); } }

/* ---------------- Narrator / dialog panel ---------------- */
#hud-narrator { position: absolute; left: 50%; bottom: 40px; transform: translate(-50%, 20px); width: min(720px, 88vw); padding: 14px 22px 16px 22px; background: linear-gradient(180deg, rgba(24, 15, 40, 0.95), rgba(15, 10, 30, 0.98)); border: 1.5px solid var(--gold); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,0.7); opacity: 0; transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
#hud-narrator.in { opacity: 1; transform: translate(-50%, 0); }
#hud-narr-speaker { color: var(--gold); letter-spacing: 2px; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
#hud-narr-text { color: var(--text); font-size: 15px; line-height: 1.5; }
#hud-narr-text.narrator { font-style: italic; color: var(--accent); font-size: 15px; line-height: 1.55; }

.hidden { display: none !important; }

/* ---------------- Screens ---------------- */
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; background: linear-gradient(135deg, rgba(15,10,30,0.94), rgba(30,15,45,0.94)); pointer-events: auto; }
.screen h1 { font-size: clamp(36px, 8vw, 72px); margin: 10px 0; letter-spacing: 6px; color: var(--gold); text-shadow: 0 0 30px rgba(255,209,102,0.4); }
.screen h2 { font-size: 24px; margin: 10px 0; color: var(--text); }
.screen p { max-width: 600px; margin: 8px auto; color: var(--text-dim); line-height: 1.5; }
.title-crown { font-size: 60px; margin-bottom: 8px; }
.subtitle { font-size: 18px !important; color: var(--accent) !important; letter-spacing: 3px; margin: 6px 0 20px !important; }
.story { font-size: 15px; font-style: italic; margin: 20px auto 30px !important; }
.controls-hint { margin-top: 30px; font-size: 12px; color: var(--text-dim); line-height: 1.8; max-width: 640px; }
.menu-btn { pointer-events: auto; padding: 14px 34px; margin: 10px; font-size: 18px; font-weight: 700; letter-spacing: 2px; color: var(--bg); background: var(--gold); border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 16px rgba(255,209,102,0.4); transition: transform 0.15s; }
.menu-btn:hover { transform: translateY(-2px); }
.menu-btn:active { transform: translateY(0); }
.stat { font-size: 18px !important; color: var(--text) !important; }
.credits { font-size: 13px !important; opacity: 0.6; margin-top: 30px !important; }
.victory-crystal { font-size: 80px; margin-bottom: 16px; animation: crystalSpin 2s linear infinite; }
@keyframes crystalSpin { from { transform: rotate(0);} to { transform: rotate(360deg);} }
.loading-bar-outer { width: min(400px, 70vw); height: 18px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; overflow: hidden; margin: 20px auto; }
.loading-bar-inner { height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold), var(--accent)); transition: width 0.2s; }
.loading-label { font-size: 13px; color: var(--text-dim); }

/* ---------------- Touch controls ---------------- */
#touch { position: fixed; inset: 0; pointer-events: none; z-index: 15; }
#touch-stick { pointer-events: auto; position: absolute; left: 24px; bottom: 24px; width: 130px; height: 130px; border-radius: 50%; background: rgba(0,0,0,0.35); border: 2px solid rgba(255,255,255,0.25); touch-action: none; }
#touch-hat { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.55); border: 2px solid rgba(255,255,255,0.9); transition: transform 0.05s; pointer-events: none; }
#touch-buttons { pointer-events: auto; position: absolute; right: 24px; bottom: 24px; display: grid; grid-template-columns: 60px 78px; grid-template-rows: 60px 78px; gap: 8px; align-items: center; }
.tb { border: 2px solid rgba(255,255,255,0.6); background: rgba(0,0,0,0.35); color: white; font-size: 24px; font-weight: 700; border-radius: 50%; cursor: pointer; touch-action: none; }
.tb.big { grid-column: 2; grid-row: 2; width: 78px; height: 78px; font-size: 34px; background: rgba(220,80,80,0.5); border-color: rgba(255,180,180,0.8); }
.tb.med { grid-column: 1; grid-row: 2; width: 60px; height: 60px; background: rgba(80,120,220,0.5); }
.tb.small { grid-column: 1 / 3; grid-row: 1; width: 60px; height: 60px; justify-self: end; }
#btn-block { grid-column: 1; grid-row: 1; justify-self: start; background: rgba(120,120,180,0.5); }
#btn-interact { grid-column: 2; grid-row: 1; background: rgba(220,180,80,0.5); }

/* hide touch controls on wider screens (assume desktop) */
@media (min-width: 900px) and (hover: hover) {
  #touch { display: none; }
}
</style>
</head>
<body>
<div id="canvas"></div>
<div id="hud"></div>
<div id="ui"></div>
<div id="touch"></div>
<script src="bundle.js"></script>
</body>
</html>
